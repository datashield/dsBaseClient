name: Lint

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same ref supersedes any run still in progress for it, so
# we don't burn compute on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: R lint (lintr)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          extra-packages: |
            cran::lintr
            cran::jsonlite

      - name: Get PR changed files
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*.R' '*.Rmd')
          echo "files<<CHANGED_FILES_EOF" >> "$GITHUB_ENV"
          echo "$files" >> "$GITHUB_ENV"
          echo "CHANGED_FILES_EOF" >> "$GITHUB_ENV"

      - name: Lint
        id: lint
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          CHANGED_FILES: ${{ env.files }}
        run: |
          Rscript -e '
            al <- lintr::available_linters()
            keep <- vapply(al$tags, function(t) any(t %in% c("correctness", "common_mistakes", "robustness")), logical(1))
            sel <- al$linter[keep]
            linter_funs <- lapply(sel, function(n) get(n, envir = asNamespace("lintr"))())
            names(linter_funs) <- sel
            lints <- lintr::lint_package(linters = linter_funs)
            cat("n lints:", length(lints), "\n")
            print(lints) # emits ::warning file=...,line=...:: annotations (auto-detects GitHub Actions)
            lintr::sarif_output(lints, "lintr_results.sarif")

            is_pr <- Sys.getenv("IS_PR") == "true"
            changed_files <- strsplit(Sys.getenv("CHANGED_FILES"), "\n")[[1]]
            changed_files <- changed_files[nzchar(changed_files)]

            lint_files <- vapply(lints, function(l) l$filename, character(1))
            is_new <- if (is_pr) lint_files %in% changed_files else rep(FALSE, length(lints))
            n_new <- sum(is_new)

            cat(sprintf("n_new=%d\n", n_new), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

            if (n_new > 0) {
              message(sprintf("Lint found %d issue(s) in files changed by this PR - see the annotations above or the SARIF upload for details.", n_new))
            }
            quit(save = "no", status = if (n_new > 0) 1 else 0)
          '

      - name: Upload lint results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: lintr_results.sarif

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const nNew = parseInt('${{ steps.lint.outputs.n_new }}' || '0', 10);
            const ok = nNew === 0;

            const postCiComment = require('${{ github.workspace }}/.github/scripts/post-ci-comment.js');
            const prNumber = await postCiComment.resolvePrNumber({ github, context });
            const runUrl = prNumber
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}/checks`
              : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await postCiComment({ github, context, updates: {
              'row:lint': `<tr><td>Code quality</td><td>${ok ? '✅ 0 findings' : `❌ ${nNew} finding${nNew === 1 ? '' : 's'}`}</td></tr>`,
              'log:lint': `<a href="${runUrl}" target="_blank" rel="noopener noreferrer">Code quality</a>`
            }});
