name: Setup R with dsBaseClient dependencies
description: >
  Installs the system libraries, R, and R package dependencies shared by the
  Opal and Armadillo setup actions. Assumes the caller has already checked
  out dsBaseClient at ./dsBaseClient.

inputs:
  additional-packages:
    description: Extra pak package specs (one per line) to install beyond the common set
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install system libraries
      shell: bash
      env:
        SYSTEM_LIBRARIES: >-
          libxml2-dev libcurl4-openssl-dev libssl-dev libgsl-dev libgit2-dev
          libharfbuzz-dev libfribidi-dev libmagick++-dev libudunits2-dev libuv1-dev
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq $SYSTEM_LIBRARIES -y

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: release
        http-user-agent: release
        use-public-rspm: true

    - uses: r-lib/actions/setup-r-dependencies@v2
      env:
        # RSPM doesn't always have a binary for every package/R-version combo; when it
        # falls back to source, pak needs LinkingTo deps present to compile it.
        PKG_INCLUDE_LINKINGTO: true
        R_PACKAGES: |
          cran::devtools
          cran::fields
          cran::meta
          cran::metafor
          cran::ggplot2
          cran::gridExtra
          cran::data.table
          cran::DSI
          cran::opalr
          cran::DSOpal
          cran::DSLite
          cran::MolgenisAuth
          cran::MolgenisArmadillo
          cran::DSMolgenisArmadillo
          cran::DescTools
          cran::e1071
          github::datashield/dsDangerClient
      with:
        working-directory: dsBaseClient
        dependencies: 'c("Depends", "Imports", "LinkingTo")'
        extra-packages: |
          ${{ env.R_PACKAGES }}
          ${{ inputs.additional-packages }}
        needs: check
